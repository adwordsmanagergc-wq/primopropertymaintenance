<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t">
<title id="t">Suburban home in Melbourne's inner south-east</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e7efea"/>
    <stop offset="1" stop-color="#c8d8d0"/>
  </linearGradient>
</defs>
<rect width="800" height="600" fill="url(#sky)"/>
<!-- distant trees -->
<g fill="#0d4a3a" opacity=".25">
  <circle cx="80" cy="370" r="80"/>
  <circle cx="190" cy="355" r="74"/>
  <circle cx="720" cy="365" r="78"/>
  <circle cx="620" cy="380" r="68"/>
</g>
<!-- ground -->
<rect x="0" y="450" width="800" height="150" fill="#b9cdc4"/>
<!-- path -->
<polygon points="350,600 460,600 500,470 320,470" fill="#d8e4df"/>
<!-- house body -->
<g transform="translate(220 200)">
  <rect x="0" y="80" width="350" height="220" fill="#0d4a3a"/>
  <!-- roof -->
  <polygon points="-40,80 175,-40 390,80" fill="#083024"/>
  <!-- chimney -->
  <rect x="270" y="-15" width="28" height="65" fill="#083024"/>
  <!-- door -->
  <rect x="148" y="180" width="64" height="120" rx="4" fill="#f4a261"/>
  <circle cx="200" cy="246" r="4" fill="#083024"/>
  <!-- left window -->
  <rect x="40" y="135" width="68" height="68" fill="#f9f5ec" rx="4"/>
  <line x1="74" y1="135" x2="74" y2="203" stroke="#0d4a3a" stroke-width="4"/>
  <line x1="40" y1="169" x2="108" y2="169" stroke="#0d4a3a" stroke-width="4"/>
  <!-- right window -->
  <rect x="240" y="135" width="68" height="68" fill="#f9f5ec" rx="4"/>
  <line x1="274" y1="135" x2="274" y2="203" stroke="#0d4a3a" stroke-width="4"/>
  <line x1="240" y1="169" x2="308" y2="169" stroke="#0d4a3a" stroke-width="4"/>
</g>
<!-- foreground tree (right) -->
<g transform="translate(670 320)">
  <rect x="-7" y="80" width="14" height="100" fill="#5b6770"/>
  <circle cx="0" cy="50" r="68" fill="#0d4a3a"/>
  <circle cx="-34" cy="70" r="46" fill="#083024" opacity=".6"/>
  <circle cx="30" cy="68" r="42" fill="#1a6e54" opacity=".7"/>
</g>
<!-- foreground bush (left) -->
<g transform="translate(100 440)">
  <ellipse cx="0" cy="0" rx="64" ry="28" fill="#0d4a3a"/>
  <ellipse cx="-25" cy="-8" rx="28" ry="18" fill="#1a6e54"/>
</g>
</svg>
