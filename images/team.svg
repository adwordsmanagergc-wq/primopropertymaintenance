<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t">
<title id="t">Primo Property Maintenance team at work</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e7efea"/>
    <stop offset="1" stop-color="#c8d8d0"/>
  </linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d4a3a"/>
    <stop offset="1" stop-color="#083024"/>
  </linearGradient>
</defs>
<rect width="800" height="600" fill="url(#sky)"/>
<!-- ground -->
<rect x="0" y="500" width="800" height="100" fill="#b9cdc4"/>
<!-- house wall on right -->
<g transform="translate(440 90)">
  <rect x="0" y="40" width="320" height="430" fill="url(#wall)"/>
  <polygon points="-30,40 160,-50 350,40" fill="#083024"/>
  <!-- window -->
  <rect x="50" y="120" width="80" height="100" fill="#f9f5ec" rx="4"/>
  <line x1="90" y1="120" x2="90" y2="220" stroke="#0d4a3a" stroke-width="4"/>
  <line x1="50" y1="170" x2="130" y2="170" stroke="#0d4a3a" stroke-width="4"/>
  <!-- door -->
  <rect x="200" y="240" width="80" height="170" rx="6" fill="#f4a261"/>
  <circle cx="265" cy="325" r="4" fill="#083024"/>
  <!-- freshly-painted strip -->
  <rect x="0" y="40" width="40" height="430" fill="#1a6e54"/>
  <rect x="0" y="40" width="40" height="20" fill="#f9f5ec" opacity=".6"/>
</g>
<!-- ladder -->
<g transform="translate(360 200)" stroke="#5b6770" stroke-width="6" stroke-linecap="round" fill="none">
  <line x1="0" y1="0" x2="-30" y2="320"/>
  <line x1="60" y1="0" x2="30" y2="320"/>
  <line x1="-5" y1="60" x2="55" y2="60"/>
  <line x1="-12" y1="140" x2="48" y2="140"/>
  <line x1="-19" y1="220" x2="41" y2="220"/>
  <line x1="-26" y1="300" x2="34" y2="300"/>
</g>
<!-- painter figure (left) -->
<g transform="translate(140 230)">
  <!-- legs -->
  <rect x="20" y="170" width="28" height="110" fill="#0d4a3a"/>
  <rect x="56" y="170" width="28" height="110" fill="#0d4a3a"/>
  <!-- boots -->
  <rect x="14" y="270" width="40" height="20" rx="4" fill="#3a3a3a"/>
  <rect x="50" y="270" width="40" height="20" rx="4" fill="#3a3a3a"/>
  <!-- shirt -->
  <rect x="10" y="80" width="84" height="100" rx="8" fill="#f4a261"/>
  <!-- arms -->
  <rect x="-8" y="90" width="22" height="80" rx="8" fill="#f4a261"/>
  <rect x="92" y="80" width="22" height="120" rx="8" fill="#f4a261" transform="rotate(-25 103 140)"/>
  <!-- head -->
  <circle cx="52" cy="56" r="30" fill="#e8c39a"/>
  <!-- cap -->
  <path d="M22 50 q30 -40 60 0 l-2 -8 q-28 -28 -56 0 z" fill="#0d4a3a"/>
  <rect x="20" y="48" width="60" height="6" fill="#0d4a3a"/>
  <!-- roller in raised arm -->
  <g transform="translate(160 60) rotate(-20)">
    <rect x="0" y="-3" width="80" height="6" fill="#5b6770"/>
    <rect x="80" y="-12" width="50" height="24" rx="6" fill="#1a6e54"/>
    <rect x="80" y="-12" width="6" height="24" fill="#5b6770"/>
  </g>
</g>
<!-- paint can -->
<g transform="translate(70 470)">
  <rect x="0" y="0" width="70" height="55" rx="4" fill="#5b6770"/>
  <rect x="0" y="0" width="70" height="10" fill="#3a3a3a"/>
  <path d="M0 0 q35 -18 70 0" fill="none" stroke="#3a3a3a" stroke-width="3"/>
  <rect x="10" y="14" width="50" height="32" fill="#1a6e54"/>
</g>
<!-- paint drips -->
<g fill="#1a6e54" opacity=".85">
  <path d="M620 530 q-6 14 0 24 q6 -10 0 -24"/>
  <path d="M580 540 q-5 10 0 16 q5 -7 0 -16"/>
</g>
</svg>
